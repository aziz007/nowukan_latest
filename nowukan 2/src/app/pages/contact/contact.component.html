      <p class="eyebrow">Contact</p>
      <h1 class="section-title">Connect With Us</h1>
      <p class="sub">Talk to the team, get support, or explore a partnership with nowUKan.</p>

      <div class="contact-mail-list">
        @for (account of mailAccounts; track account.address) {
          <div class="contact-mail-row">
            <span class="contact-mail-label">{{ account.label }}</span>
            <a class="contact-mail-email" [href]="account.mailto">{{ account.address }}</a>
          </div>
        }
      </div>

      <app-enquiry-form
        heading="Send Us A Message"
        successMessage="Thanks — your enquiry has been received. We'll be in touch shortly."
      />
    </div>
